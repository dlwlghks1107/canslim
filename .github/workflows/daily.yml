name: CAN SLIM 데일리 스크리닝

on:
  schedule:
    # UTC 기준 → 한국시간 오전 7시 (미국장 마감 후, 한국장 시작 전)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 스크리닝 실행 + 텔레그램 발송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screener.py

      - name: 리포트 커밋 (GitHub Pages 갱신)
        run: |
          git config user.name "canslim-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          git commit -m "리포트 갱신 $(date +'%Y-%m-%d')" || echo "변경 없음"
          git push
